name: GitHub Readme Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Top Langs SVG
        uses: kyle1320/github-readme-stats-action@v1.0.2
        with:
          username: lucascostabueno
          token: ${{ secrets.GITHUB_TOKEN }}
          card: top-langs
          options: layout=donut&theme=github_dark
          path: top-langs.svg

      - name: Generate Stats SVG
        uses: kyle1320/github-readme-stats-action@v1.0.2
        with:
          username: lucascostabueno
          token: ${{ secrets.GITHUB_TOKEN }}
          card: stats
          options: show_icons=true&theme=github_dark
          path: stats.svg

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update github stats svgs" && git push)
