name: GitHub Readme Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone official github-readme-stats
        run: git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs

      - name: Install dependencies
        working-directory: /tmp/grs
        run: npm ci --omit=dev --ignore-scripts

      - name: Generate SVGs
        working-directory: /tmp/grs
        env:
          PAT_1: ${{ secrets.STATS_TOKEN }}
        run: |
          node --input-type=module -e '
            import fs from "fs";
            import statsApi from "./api/index.js";
            import langsApi from "./api/top-langs.js";

            const mockRes = (file) => ({
              setHeader: () => {},
              send: (svg) => fs.writeFileSync(file, svg)
            });

            await statsApi(
              { query: { username: "lucascostabueno", show_icons: "true", theme: "github_dark" } },
              mockRes("${{ github.workspace }}/stats.svg")
            );
            await langsApi(
              { query: { username: "lucascostabueno", layout: "donut", theme: "github_dark" } },
              mockRes("${{ github.workspace }}/top-langs.svg")
            );
          '

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update github stats svgs"
            git pull --rebase origin main
            git push
          fi
